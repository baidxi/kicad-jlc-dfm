name: Release PCM package

# 两种触发方式:
#   1. 手动:Actions 页 → Release PCM package → Run workflow(可填版本号,默认 0.1.0)
#      → 构建并上传 artifact(供本地测试,不创建 Release)
#   2. 自动:推送 v* 标签(如 v1.0.0)
#      → 构建并创建 GitHub Release,上传:
#        - lceda-kicad-plugin-<版本>-pcm.zip       ← 插件管理器「从文件安装」用
#        - …-pcm.repository-entry.json             ← 提交官方 kicad/addons 仓库用

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "包版本号(如 1.0.0,留空用 0.1.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 拉取 kicad-python 子模块;其内嵌 kicad 由后续步骤按 dist.sh 语义初始化
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 说明:不 pip install kicad-python —— 打包与校验均使用 checkout 的 submodule 副本,
      # pb2/pyi/kicad_api_version.py 按 kicad-python 官方 dist.sh 流程现场生成(见下)。
      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_NAME" == v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.1.0" >> "$GITHUB_OUTPUT"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi

      # ===== kicad-python 官方 dist.sh 的等价初始化 =====
      # dist.sh 在 kicad-python 目录内执行两步:
      #   1) git submodule update --init --recursive
      #   2) poetry build → 经 pyproject [tool.poetry.build] 触发 build.py::pre_build():
      #      用内嵌 kicad 的 proto 生成 kipy pb2/pyi,并以 git describe 写 kicad_api_version.py
      # CI 等价实现:内嵌 kicad 直接 clone baidxi fork 的 master(维护者自编译 KiCad,
      # 持续跟进 master,gitlink 指针可能滞后,故不按旧指针检出),再调用同一构建脚本。
      - name: "Init kicad sources (dist.sh step 1: submodule init)"
        run: git clone https://github.com/baidxi/kicad.git kicad-python/kicad

      - name: "Generate kipy pb2/pyi + kicad_api_version.py (dist.sh step 2: poetry build hook)"
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q protobuf-compiler
          pip install "protobuf>=5.29,<6" "mypy-protobuf==3.6.0" protoletariat setuptools
          cd kicad-python
          python3 -c "import build; build.pre_build()"
          # dist.sh 在构建后同样打印该文件供人工核对版本
          echo "------ kicad_api_version.py ------"
          cat kipy/kicad_api_version.py
          echo "----------------------------------"

      - name: Build PCM package
        run: |
          echo "Package version: ${{ steps.ver.outputs.version }}"
          python3 packaging/build_pcm.py --no-validate --version "${{ steps.ver.outputs.version }}"

      - name: Validate package (kipy from submodule copy)
        run: |
          # kicad_api_version.py 与 pb2/pyi 均已由上方 kicad-python 官方 pre_build 生成
          # cli 加载 kipy/__init__ 全链:一次性装齐 kipy 的全部运行时依赖
          pip install jsonschema "protobuf>=5.29,<6" pynng zstandard typing_extensions
          PYTHONPATH="$GITHUB_WORKSPACE/kicad-python" \
            python3 -m kipy.packaging.cli validate dist/*-pcm.zip

      - name: Check package contents
        run: |
          python3 - <<'EOF'
          import glob, zipfile
          zips = glob.glob("dist/*-pcm.zip")
          assert len(zips) == 1, f"expected exactly one zip, got {zips}"
          names = zipfile.ZipFile(zips[0]).namelist()
          assert "metadata.json" in names, "missing metadata.json"
          assert "plugins/lceda-kicad-plugin/plugin.json" in names, "missing plugin manifest"
          assert any(n.endswith("lceda_plugin/main.py") for n in names), "missing app code"
          assert any(n.endswith("kipy/__init__.py") for n in names), "missing bundled kipy"
          assert any(n.endswith("pip.pyz") for n in names), "missing bundled pip.pyz"
          pb2 = zipfile.ZipFile(zips[0]).read(
              "plugins/lceda-kicad-plugin/kipy/proto/schematic/schematic_commands_pb2.py")
          assert b"interactive" in pb2, "bundled kipy 缺 interactive 扩展(应来自 baidxi fork)"
          board_pb2 = zipfile.ZipFile(zips[0]).read(
              "plugins/lceda-kicad-plugin/kipy/proto/board/board_types_pb2.py")
          assert b"DrillChartAlign" in board_pb2, (
              "bundled kipy 缺 DrillChartAlign:"
              "baidxi/kicad master 的 proto 未包含该定义,请补入 fork 后重跑")
          print("package contents OK")
          EOF

      - name: Upload build artifact (manual runs)
        if: steps.ver.outputs.is_tag != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lceda-kicad-plugin-${{ steps.ver.outputs.version }}-pcm
          path: |
            dist/*-pcm.zip
            dist/*-pcm.repository-entry.json

      - name: Create GitHub Release (tag pushes)
        if: steps.ver.outputs.is_tag == 'true'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*-pcm.zip
            dist/*-pcm.repository-entry.json
